name: Bootstrap and Release MYWO 0.9.0

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified MYWO source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.bootstrap\part*.b64' | Sort-Object Name
          if ($parts.Count -ne 14) { throw "Expected 14 bootstrap source parts; found $($parts.Count)." }

          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 164200) { throw "Unexpected bootstrap Base64 length: $($b64.Length)." }

          $zip = Join-Path $env:RUNNER_TEMP 'MYWO-bootstrap-source-v0.9.0.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '44673a608a6e34d519074b3e2f4fd7849ec1b1902985da6ed6af18c2462f664a') {
            throw "Bootstrap source SHA-256 mismatch: $hash"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'MYWO-source'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          Get-ChildItem $stage -Force | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $PWD $_.Name) -Recurse -Force
          }

          $logoB64 = Get-Content '.bootstrap\mywo-logo.png.b64' -Raw
          $iconB64 = Get-Content '.bootstrap\mywo.ico.b64' -Raw
          $logoPath = 'src\MYWO.Desktop\Assets\mywo-logo.png'
          $iconPath = 'src\MYWO.Desktop\Assets\mywo.ico'
          [IO.File]::WriteAllBytes($logoPath, [Convert]::FromBase64String($logoB64))
          [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconB64))

          $logoHash = (Get-FileHash $logoPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $iconHash = (Get-FileHash $iconPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($logoHash -ne '78ecc16ce729a8bfa9e42181da53807e6b6f54f7f5fd773b9e540d1cebc61368') { throw "Logo hash mismatch: $logoHash" }
          if ($iconHash -ne '3c7b4a89202c7b3eee6f56a590ceeb424cff9508750121a596c4872a82fdbcb3') { throw "Icon hash mismatch: $iconHash" }

      - name: Commit complete v0.9.0 source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path '.bootstrap') { Remove-Item '.bootstrap' -Recurse -Force }
          if (Test-Path '.github\workflows\bootstrap-release.yml') { Remove-Item '.github\workflows\bootstrap-release.yml' -Force }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m "MYWO 0.9.0 Windows release source [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host 'Source already committed.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Validate source
        shell: pwsh
        run: .\scripts\validate-source.ps1

      - name: Build release
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version 0.9.0

      - name: Portable runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Join-Path $env:RUNNER_TEMP 'mywo-portable-smoke'
          if (Test-Path $test) { Remove-Item $test -Recurse -Force }
          New-Item -ItemType Directory -Path $test -Force | Out-Null
          Copy-Item '.\dist\MYWO-Portable.exe' (Join-Path $test 'MYWO-Portable.exe')
          $p = Start-Process (Join-Path $test 'MYWO-Portable.exe') -WorkingDirectory $test -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Portable app exited during smoke test with code $($p.ExitCode)." }
          if (-not (Test-Path (Join-Path $test 'MYWO-Data\mywo.db'))) { throw 'Portable mode did not create MYWO-Data\mywo.db.' }
          Stop-Process -Id $p.Id -Force

      - name: Setup and integrated uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\dist\MYWO-Setup.exe --silent
          Start-Sleep -Seconds 4
          $install = Join-Path $env:LOCALAPPDATA 'Programs\MYWO'
          if (-not (Test-Path (Join-Path $install 'MYWO.exe'))) { throw 'Installed MYWO.exe is missing.' }
          if (-not (Test-Path (Join-Path $install 'MYWO-Update.exe'))) { throw 'Installed MYWO-Update.exe is missing.' }
          if (Test-Path (Join-Path $install 'uninstall.exe')) { throw 'Standalone uninstall.exe must not be shipped.' }
          if (Get-ChildItem $install -Filter 'unins*.exe' -ErrorAction SilentlyContinue) { throw 'Standalone unins*.exe must not be shipped.' }

          $key = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MYWO'
          if ($key.UninstallString -notmatch 'MYWO-Update\.exe.*--uninstall') {
            throw "Integrated uninstall command is incorrect: $($key.UninstallString)"
          }

          & (Join-Path $install 'MYWO-Update.exe') --uninstall --quiet
          Start-Sleep -Seconds 8
          if (Test-Path $install) { throw 'Integrated uninstall did not remove the installation directory.' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MYWO') {
            throw 'Integrated uninstall registry entry still exists.'
          }

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'MYWO-Setup.exe',
            'MYWO-Portable.exe',
            'MYWO-Update.exe',
            'MYWO-Update-Payload-0.9.0.zip',
            'update.json',
            'SHA256SUMS.txt',
            'MYWO-0.9.0-source.zip'
          )
          foreach ($name in $required) {
            $path = Join-Path '.\dist' $name
            if (-not (Test-Path $path)) { throw "Missing $name" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty $name" }
            Write-Host "$name -> $((Get-Item $path).Length) bytes"
          }
          if (Get-ChildItem '.\dist' -Filter 'unins*.exe' -ErrorAction SilentlyContinue) { throw 'Release contains forbidden unins*.exe.' }
          if (Test-Path '.\dist\uninstall.exe') { throw 'Release contains forbidden standalone uninstall.exe.' }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-0.9.0-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v0.9.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.9.0'
          $notes = @'
          MYWO 0.9.0 Windows release.

          Deliverables:
          - MYWO-Setup.exe
          - MYWO-Portable.exe
          - MYWO-Update.exe
          - integrated uninstall through MYWO-Update.exe --uninstall
          - no standalone uninstall.exe or unins*.exe
          - automatic update payload and update.json
          - refreshed MYWO branding/icon assets
          - source archive and SHA-256 checksums
          '@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title 'MYWO 0.9.0' --notes $notes
          } else {
            gh release create $tag --title 'MYWO 0.9.0' --notes $notes --latest
          }

          Get-ChildItem '.\dist' -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name) to release." }
          }

          Write-Host "Published https://github.com/bren-wp/MYWO/releases/tag/$tag"
