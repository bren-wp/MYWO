name: MYWO v0.9.2 Chat Delivery

on:
  push:
    branches:
      - chatgpt/mywo-v0.9.2-delivery

permissions:
  contents: read

jobs:
  export-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified v0.9.2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p export
          gh release download v0.9.2 --repo "${GITHUB_REPOSITORY}" --dir export
          ls -lah export

      - name: Export Setup
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Setup-v0.9.2
          path: export/MYWO-Setup.exe
          compression-level: 0
          if-no-files-found: error

      - name: Export Portable
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Portable-v0.9.2
          path: export/MYWO-Portable.exe
          compression-level: 0
          if-no-files-found: error

      - name: Export Updater
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Update-v0.9.2
          path: export/MYWO-Update.exe
          compression-level: 0
          if-no-files-found: error

      - name: Export Source
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Source-v0.9.2
          path: export/MYWO-0.9.2-source.zip
          compression-level: 0
          if-no-files-found: error

      - name: Export Update Payload
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Update-Payload-v0.9.2
          path: export/MYWO-Update-Payload-0.9.2.zip
          compression-level: 0
          if-no-files-found: error

      - name: Export Installed Files
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Installed-Files-v0.9.2
          path: export/MYWO-Installed-Files-0.9.2.zip
          compression-level: 0
          if-no-files-found: error

      - name: Export Metadata
        uses: actions/upload-artifact@v4
        with:
          name: MYWO-Metadata-v0.9.2
          path: |
            export/SHA256SUMS.txt
            export/update.json
          compression-level: 0
          if-no-files-found: error
